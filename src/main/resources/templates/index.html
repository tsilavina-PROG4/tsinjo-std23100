<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Tsinjo - Dons et Aides</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container py-4">
    <h1 class="mb-4">Tsinjo - Dons et Aides</h1>
    <div class="card mb-4">
        <div class="card-body">
            <h2 class="card-title">Faire un don</h2>
            <form th:action="@{/donate}" th:object="${donationForm}" method="post">
                <div class="mb-3">
                    <label for="donor" class="form-label">Nom du donateur</label>
                    <input type="text" th:field="*{donor.name}" class="form-control" id="donor" required>
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label">Email du donateur</label>
                    <input type="email" th:field="*{donor.email}" class="form-control" id="email" required>
                </div>
                <div class="mb-3">
                    <label for="amount" class="form-label">Montant</label>
                    <input type="number" th:field="*{amount}" class="form-control" id="amount" step="0.01" required>
                </div>
                <button type="submit" class="btn btn-primary">Donner</button>
            </form>
        </div>
    </div>
    <h2 class="mb-3">Historique des dons</h2>
    <table class="table table-striped">
        <thead>
            <tr>
                <th>Date</th>
                <th>Donateur</th>
                <th>Email</th>
                <th>Montant</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="donation : ${donations}">
                <td th:text="${#dates.format(donation.date, 'yyyy-MM-dd HH:mm')}"></td>
                <td th:text="${donation.donor != null ? donation.donor.name : ''}"></td>
                <td th:text="${donation.donor != null ? donation.donor.email : ''}"></td>
                <td th:text="${donation.amount}"></td>
            </tr>
        </tbody>
    </table>
    <h2 class="mb-3">Historique des aides</h2>
    <table class="table table-striped">
        <thead>
            <tr>
                <th>Date</th>
                <th>Bénéficiaire</th>
                <th>Email</th>
                <th>Montant</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="help : ${helps}">
                <td th:text="${#dates.format(help.date, 'yyyy-MM-dd HH:mm')}"></td>
                <td th:text="${help.beneficiary != null ? help.beneficiary.name : ''}"></td>
                <td th:text="${help.beneficiary != null ? help.beneficiary.email : ''}"></td>
                <td th:text="${help.amount}"></td>
            </tr>
        </tbody>
    </table>
</body>
</html>
