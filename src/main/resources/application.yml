spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/tsinjo
    username: tsinjo
    password: tsinjo
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
